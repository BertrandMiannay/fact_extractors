[tool.poetry]
name = "ChaTP"
version = "0.2.0"
description = "Benchmark d'approches IA pour répondre à des questions de plongée"
packages = [
    {include = "api"},
    {include = "approaches"},
]

[tool.poetry.dependencies]
python = "^3.10"
anthropic = "^0.50.0"
streamlit = "^1.43.0"
python-dotenv = "^1.2.1"
mistralai = "^2.3.0"
pypdf = "^6.9.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
